<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="50%" style="stop-color:#1e1b4b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#ec4899"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Grid pattern -->
  <g opacity="0.1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#8b5cf6" stroke-width="0.5"/>
    </pattern>
    <rect width="1200" height="630" fill="url(#grid)"/>
  </g>
  
  <!-- Decorative contour lines (optimization landscape) -->
  <g opacity="0.15" transform="translate(850, 320)">
    <ellipse cx="0" cy="0" rx="280" ry="200" fill="none" stroke="#3b82f6" stroke-width="1"/>
    <ellipse cx="0" cy="0" rx="220" ry="160" fill="none" stroke="#3b82f6" stroke-width="1"/>
    <ellipse cx="0" cy="0" rx="160" ry="115" fill="none" stroke="#3b82f6" stroke-width="1"/>
    <ellipse cx="0" cy="0" rx="100" ry="70" fill="none" stroke="#3b82f6" stroke-width="1"/>
    <ellipse cx="0" cy="0" rx="50" ry="35" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
  </g>
  
  <!-- Constraint curve cutting through -->
  <path d="M 650 580 Q 850 300 1150 100" stroke="url(#accentGrad)" stroke-width="3" fill="none" opacity="0.6" filter="url(#glow)"/>
  
  <!-- SVM visualization on right side -->
  <g transform="translate(900, 315)">
    <!-- Decision boundary -->
    <line x1="-120" y1="150" x2="120" y2="-150" stroke="#fbbf24" stroke-width="3" filter="url(#glow)"/>
    <!-- Margin lines -->
    <line x1="-90" y1="150" x2="150" y2="-120" stroke="#fbbf24" stroke-width="1" stroke-dasharray="8,4" opacity="0.5"/>
    <line x1="-150" y1="120" x2="90" y2="-150" stroke="#fbbf24" stroke-width="1" stroke-dasharray="8,4" opacity="0.5"/>
    
    <!-- Class 1 points (blue) -->
    <circle cx="-80" cy="60" r="12" fill="#3b82f6" filter="url(#glow)"/>
    <circle cx="-60" cy="100" r="12" fill="#3b82f6"/>
    <circle cx="-100" cy="30" r="12" fill="#3b82f6"/>
    <circle cx="-50" cy="40" r="14" fill="#3b82f6" stroke="#60a5fa" stroke-width="3"/>
    <circle cx="-120" cy="80" r="12" fill="#3b82f6"/>
    
    <!-- Class 2 points (pink) -->
    <circle cx="80" cy="-60" r="12" fill="#ec4899" filter="url(#glow)"/>
    <circle cx="60" cy="-100" r="12" fill="#ec4899"/>
    <circle cx="100" cy="-30" r="12" fill="#ec4899"/>
    <circle cx="50" cy="-50" r="14" fill="#ec4899" stroke="#f472b6" stroke-width="3"/>
    <circle cx="120" cy="-80" r="12" fill="#ec4899"/>
  </g>
  
  <!-- Mathematical symbols floating -->
  <g font-family="Georgia, serif" fill="#e2e8f0" opacity="0.12">
    <text x="100" y="120" font-size="48">∇</text>
    <text x="200" y="500" font-size="40">λ</text>
    <text x="1050" y="150" font-size="36">∂L/∂x</text>
    <text x="150" y="350" font-size="32">≤</text>
    <text x="750" y="550" font-size="38">Σ</text>
    <text x="1080" y="520" font-size="44">α</text>
  </g>
  
  <!-- Main title area with glass effect -->
  <rect x="60" y="160" width="520" height="310" rx="20" fill="#1e293b" opacity="0.7"/>
  <rect x="60" y="160" width="520" height="310" rx="20" fill="none" stroke="url(#accentGrad)" stroke-width="2" opacity="0.5"/>
  
  <!-- Title text -->
  <text x="90" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="#94a3b8" font-weight="500">THE MATHEMATICS OF</text>
  
  <text x="90" y="295" font-family="system-ui, -apple-system, sans-serif" font-size="52" fill="#f8fafc" font-weight="700">Lagrangians</text>
  
  <text x="90" y="355" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="700" fill="url(#accentGrad)">KKT &amp; SVMs</text>
  
  <!-- Subtitle -->
  <text x="90" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#94a3b8">From constrained optimization to the kernel trick</text>
  
  <!-- Key equation highlight -->
  <g transform="translate(90, 440)">
    <rect x="0" y="0" width="280" height="36" rx="8" fill="#3b82f6" opacity="0.2"/>
    <text x="15" y="25" font-family="Georgia, serif" font-size="20" fill="#60a5fa" font-style="italic">∇f(x*) = λ∇g(x*)</text>
  </g>
  
  <!-- Flow arrows at bottom -->
  <g transform="translate(600, 580)">
    <rect x="0" y="0" width="100" height="32" rx="6" fill="#3b82f6" opacity="0.3"/>
    <text x="50" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#93c5fd" font-weight="600">Lagrangian</text>
    
    <path d="M 110 16 L 130 16" stroke="#64748b" stroke-width="2"/>
    <polygon points="130,12 138,16 130,20" fill="#64748b"/>
    
    <rect x="145" y="0" width="65" height="32" rx="6" fill="#8b5cf6" opacity="0.3"/>
    <text x="177" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#c4b5fd" font-weight="600">KKT</text>
    
    <path d="M 220 16 L 240 16" stroke="#64748b" stroke-width="2"/>
    <polygon points="240,12 248,16 240,20" fill="#64748b"/>
    
    <rect x="255" y="0" width="70" height="32" rx="6" fill="#ec4899" opacity="0.3"/>
    <text x="290" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#f9a8d4" font-weight="600">Duality</text>
    
    <path d="M 335 16 L 355 16" stroke="#64748b" stroke-width="2"/>
    <polygon points="355,12 363,16 355,20" fill="#64748b"/>
    
    <rect x="370" y="0" width="60" height="32" rx="6" fill="url(#goldGrad)" opacity="0.4"/>
    <text x="400" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#fef3c7" font-weight="600">SVM</text>
  </g>
  
  <!-- Corner accent -->
  <path d="M 0 0 L 150 0 L 0 150 Z" fill="url(#accentGrad)" opacity="0.1"/>
  <path d="M 1200 630 L 1050 630 L 1200 480 Z" fill="url(#accentGrad)" opacity="0.1"/>
  
  <!-- Glowing orb for visual interest -->
  <circle cx="750" cy="200" r="60" fill="#8b5cf6" opacity="0.1" filter="url(#softGlow)"/>
  <circle cx="750" cy="200" r="30" fill="#8b5cf6" opacity="0.15" filter="url(#softGlow)"/>
</svg>
