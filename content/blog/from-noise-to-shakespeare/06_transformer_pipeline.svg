<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', monospace">
  <defs>
    <linearGradient id="bg6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#111116"/>
    </linearGradient>
  </defs>
  <rect width="900" height="500" fill="url(#bg6)" rx="12"/>

  <text x="450" y="28" text-anchor="middle" fill="#888" font-size="11" letter-spacing="3" font-weight="600">INSIDE THE MODEL: TOKEN IDS → LOGITS</text>

  <!-- Input -->
  <text x="450" y="58" text-anchor="middle" fill="#555" font-size="9">Input: masked sequence</text>
  <rect x="220" y="65" width="460" height="32" fill="#161620" rx="6"/>
  <text x="450" y="86" text-anchor="middle" font-size="13">
    <tspan fill="#e8e8e8">h</tspan>
    <tspan fill="#888">  </tspan>
    <tspan fill="#f59e0b">_</tspan>
    <tspan fill="#888">  </tspan>
    <tspan fill="#e8e8e8">l</tspan>
    <tspan fill="#888">  </tspan>
    <tspan fill="#f59e0b">_</tspan>
    <tspan fill="#888">  </tspan>
    <tspan fill="#e8e8e8">o</tspan>
  </text>
  <text x="700" y="86" fill="#444" font-size="9">(64, 256)</text>

  <!-- Arrow -->
  <line x1="450" y1="97" x2="450" y2="115" stroke="#444" stroke-width="1"/>
  <polygon points="450,120 446,112 454,112" fill="#444"/>

  <!-- Embedding -->
  <rect x="270" y="122" width="360" height="36" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-width="1" rx="6"/>
  <text x="450" y="144" text-anchor="middle" fill="#3b82f6" font-size="11">Token Embedding + RoPE</text>
  <text x="700" y="144" fill="#444" font-size="9">(64, 256, 384)</text>

  <!-- Arrow -->
  <line x1="450" y1="158" x2="450" y2="176" stroke="#444" stroke-width="1"/>
  <polygon points="450,181 446,173 454,173" fill="#444"/>

  <!-- Transformer block (repeated) -->
  <rect x="200" y="183" width="500" height="155" fill="#161620" rx="8" stroke="#333" stroke-width="0.5"/>
  <text x="210" y="202" fill="#555" font-size="9">× 6 layers</text>

  <!-- Attention sub-block -->
  <rect x="230" y="210" width="440" height="36" fill="#8b5cf6" fill-opacity="0.1" stroke="#8b5cf6" stroke-width="1" rx="5"/>
  <text x="450" y="228" text-anchor="middle" fill="#8b5cf6" font-size="10">RMSNorm → Multi-Head Attention (6 heads × 64 dims, bidirectional)</text>
  <text x="450" y="240" text-anchor="middle" fill="#555" font-size="8">Q×K^T → softmax → ×V | every position sees every position</text>

  <!-- + residual label -->
  <text x="688" y="232" fill="#555" font-size="9">+ residual</text>

  <!-- Arrow within block -->
  <line x1="450" y1="248" x2="450" y2="266" stroke="#444" stroke-width="1"/>
  <polygon points="450,271 446,263 454,263" fill="#444"/>

  <!-- MLP sub-block -->
  <rect x="230" y="273" width="440" height="36" fill="#ec4899" fill-opacity="0.1" stroke="#ec4899" stroke-width="1" rx="5"/>
  <text x="450" y="291" text-anchor="middle" fill="#ec4899" font-size="10">RMSNorm → MLP (384 → 1536 → ReLU² → 384)</text>
  <text x="450" y="303" text-anchor="middle" fill="#555" font-size="8">expand 4×, non-linear activation, compress back</text>

  <!-- + residual label -->
  <text x="688" y="295" fill="#555" font-size="9">+ residual</text>

  <!-- Shape label -->
  <text x="700" y="270" fill="#444" font-size="9">(64, 256, 384)</text>

  <!-- Arrow -->
  <line x1="450" y1="338" x2="450" y2="356" stroke="#444" stroke-width="1"/>
  <polygon points="450,361 446,353 454,353" fill="#444"/>

  <!-- Output projection -->
  <rect x="250" y="363" width="400" height="36" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-width="1" rx="6"/>
  <text x="450" y="381" text-anchor="middle" fill="#10b981" font-size="11">RMSNorm → Output Projection (384 → 67 vocab)</text>
  <text x="450" y="393" text-anchor="middle" fill="#555" font-size="8">dot product with each token's template vector</text>
  <text x="700" y="385" fill="#444" font-size="9">(64, 256, 67)</text>

  <!-- Arrow -->
  <line x1="450" y1="399" x2="450" y2="417" stroke="#444" stroke-width="1"/>
  <polygon points="450,422 446,414 454,414" fill="#444"/>

  <!-- Output -->
  <rect x="250" y="424" width="400" height="36" fill="#f59e0b" fill-opacity="0.08" stroke="#f59e0b" stroke-width="1" rx="6"/>
  <text x="450" y="442" text-anchor="middle" fill="#f59e0b" font-size="11">Softmax → probabilities (MASK logit clamped to −∞)</text>
  <text x="450" y="454" text-anchor="middle" fill="#555" font-size="8">SUBS zero-masking: model never predicts MASK as output</text>

  <!-- Bottom note -->
  <text x="450" y="485" text-anchor="middle" fill="#333" font-size="9">Loss = −log(probability of correct token) averaged over masked positions only</text>
</svg>
