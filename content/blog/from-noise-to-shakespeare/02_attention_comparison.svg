<svg viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', monospace">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#111116"/>
    </linearGradient>
  </defs>
  <rect width="900" height="400" fill="url(#bg2)" rx="12"/>

  <text x="450" y="32" text-anchor="middle" fill="#888" font-size="11" letter-spacing="3" font-weight="600">THE ONE-LINE ARCHITECTURAL CHANGE</text>

  <!-- CAUSAL (GPT) -->
  <text x="225" y="65" text-anchor="middle" fill="#e8e8e8" font-size="14" font-weight="600">GPT: Causal Attention</text>
  <text x="225" y="82" text-anchor="middle" fill="#555" font-size="10">is_causal = True</text>

  <!-- Column labels causal -->
  <text x="110" y="108" fill="#666" font-size="9" text-anchor="middle">h</text>
  <text x="155" y="108" fill="#666" font-size="9" text-anchor="middle">e</text>
  <text x="200" y="108" fill="#666" font-size="9" text-anchor="middle">l</text>
  <text x="245" y="108" fill="#666" font-size="9" text-anchor="middle">l</text>
  <text x="290" y="108" fill="#666" font-size="9" text-anchor="middle">o</text>

  <!-- Row labels causal -->
  <text x="85" y="140" fill="#666" font-size="9" text-anchor="end">h</text>
  <text x="85" y="185" fill="#666" font-size="9" text-anchor="end">e</text>
  <text x="85" y="230" fill="#666" font-size="9" text-anchor="end">l</text>
  <text x="85" y="275" fill="#666" font-size="9" text-anchor="end">l</text>
  <text x="85" y="320" fill="#666" font-size="9" text-anchor="end">o</text>

