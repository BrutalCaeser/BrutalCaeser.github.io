  <rect x="677" y="118" width="38" height="38" fill="#10b981" opacity="0.3" rx="3"/>
  <rect x="722" y="118" width="38" height="38" fill="#10b981" opacity="0.4" rx="3"/>

  <rect x="542" y="163" width="38" height="38" fill="#10b981" opacity="0.6" rx="3"/>
  <rect x="587" y="163" width="38" height="38" fill="#10b981" opacity="0.3" rx="3"/>
  <rect x="632" y="163" width="38" height="38" fill="#10b981" opacity="0.7" rx="3"/>
  <rect x="677" y="163" width="38" height="38" fill="#10b981" opacity="0.3" rx="3"/>
  <rect x="722" y="163" width="38" height="38" fill="#10b981" opacity="0.5" rx="3"/>

  <rect x="542" y="208" width="38" height="38" fill="#10b981" opacity="0.4" rx="3"/>
  <rect x="587" y="208" width="38" height="38" fill="#10b981" opacity="0.3" rx="3"/>
  <rect x="632" y="208" width="38" height="38" fill="#10b981" opacity="0.5" rx="3"/>
  <rect x="677" y="208" width="38" height="38" fill="#10b981" opacity="0.3" rx="3"/>
  <rect x="722" y="208" width="38" height="38" fill="#10b981" opacity="0.4" rx="3"/>

  <rect x="542" y="253" width="38" height="38" fill="#10b981" opacity="0.5" rx="3"/>
  <rect x="587" y="253" width="38" height="38" fill="#10b981" opacity="0.3" rx="3"/>
  <rect x="632" y="253" width="38" height="38" fill="#10b981" opacity="0.6" rx="3"/>
  <rect x="677" y="253" width="38" height="38" fill="#10b981" opacity="0.3" rx="3"/>
  <rect x="722" y="253" width="38" height="38" fill="#10b981" opacity="0.5" rx="3"/>

  <rect x="542" y="298" width="38" height="38" fill="#10b981" opacity="0.4" rx="3"/>
  <rect x="587" y="298" width="38" height="38" fill="#10b981" opacity="0.3" rx="3"/>
  <rect x="632" y="298" width="38" height="38" fill="#10b981" opacity="0.5" rx="3"/>
  <rect x="677" y="298" width="38" height="38" fill="#10b981" opacity="0.3" rx="3"/>
  <rect x="722" y="298" width="38" height="38" fill="#10b981" opacity="0.6" rx="3"/>

  <text x="675" y="360" text-anchor="middle" fill="#555" font-size="10">Every position sees every other position</text>
  <text x="675" y="376" text-anchor="middle" fill="#555" font-size="10">"What's around me everywhere?"</text>

  <!-- Divider -->
  <line x1="450" y1="55" x2="450" y2="385" stroke="#222" stroke-width="1" stroke-dasharray="4,4"/>
