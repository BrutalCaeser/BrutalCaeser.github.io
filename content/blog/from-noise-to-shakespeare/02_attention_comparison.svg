  <rect x="137" y="118" width="38" height="38" fill="#1a1a1a" rx="3" stroke="#222" stroke-width="0.5"/>
  <rect x="182" y="118" width="38" height="38" fill="#1a1a1a" rx="3" stroke="#222" stroke-width="0.5"/>
  <rect x="227" y="118" width="38" height="38" fill="#1a1a1a" rx="3" stroke="#222" stroke-width="0.5"/>
  <rect x="272" y="118" width="38" height="38" fill="#1a1a1a" rx="3" stroke="#222" stroke-width="0.5"/>
  <rect x="182" y="163" width="38" height="38" fill="#1a1a1a" rx="3" stroke="#222" stroke-width="0.5"/>
  <rect x="227" y="163" width="38" height="38" fill="#1a1a1a" rx="3" stroke="#222" stroke-width="0.5"/>
  <rect x="272" y="163" width="38" height="38" fill="#1a1a1a" rx="3" stroke="#222" stroke-width="0.5"/>
  <rect x="227" y="208" width="38" height="38" fill="#1a1a1a" rx="3" stroke="#222" stroke-width="0.5"/>
  <rect x="272" y="208" width="38" height="38" fill="#1a1a1a" rx="3" stroke="#222" stroke-width="0.5"/>
  <rect x="272" y="253" width="38" height="38" fill="#1a1a1a" rx="3" stroke="#222" stroke-width="0.5"/>

  <!-- -∞ labels in blocked cells -->
  <text x="156" y="142" text-anchor="middle" fill="#444" font-size="8">-∞</text>
  <text x="201" y="142" text-anchor="middle" fill="#444" font-size="8">-∞</text>
  <text x="246" y="142" text-anchor="middle" fill="#444" font-size="8">-∞</text>
  <text x="291" y="142" text-anchor="middle" fill="#444" font-size="8">-∞</text>
  <text x="201" y="187" text-anchor="middle" fill="#444" font-size="8">-∞</text>
  <text x="246" y="187" text-anchor="middle" fill="#444" font-size="8">-∞</text>
  <text x="291" y="187" text-anchor="middle" fill="#444" font-size="8">-∞</text>

  <text x="225" y="360" text-anchor="middle" fill="#555" font-size="10">Each position sees only past tokens</text>
  <text x="225" y="376" text-anchor="middle" fill="#555" font-size="10">"What came before me?"</text>

  <!-- BIDIRECTIONAL (Diffusion) -->
  <text x="675" y="65" text-anchor="middle" fill="#e8e8e8" font-size="14" font-weight="600">Diffusion: Bidirectional Attention</text>
  <text x="675" y="82" text-anchor="middle" fill="#555" font-size="10">is_causal = False</text>

  <!-- Column labels bidirectional -->
  <text x="560" y="108" fill="#666" font-size="9" text-anchor="middle">h</text>
  <text x="605" y="108" fill="#666" font-size="9" text-anchor="middle">_</text>
  <text x="650" y="108" fill="#666" font-size="9" text-anchor="middle">l</text>
  <text x="695" y="108" fill="#666" font-size="9" text-anchor="middle">_</text>
  <text x="740" y="108" fill="#666" font-size="9" text-anchor="middle">o</text>

  <!-- Row labels bidirectional -->
  <text x="535" y="140" fill="#666" font-size="9" text-anchor="end">h</text>
  <text x="535" y="185" fill="#f59e0b" font-size="9" text-anchor="end">_</text>
  <text x="535" y="230" fill="#666" font-size="9" text-anchor="end">l</text>
  <text x="535" y="275" fill="#f59e0b" font-size="9" text-anchor="end">_</text>
  <text x="535" y="320" fill="#666" font-size="9" text-anchor="end">o</text>

