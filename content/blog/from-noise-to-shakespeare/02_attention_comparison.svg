  <rect x="92" y="118" width="38" height="38" fill="#3b82f6" opacity="0.7" rx="3"/>
  <rect x="92" y="163" width="38" height="38" fill="#3b82f6" opacity="0.5" rx="3"/>
  <rect x="137" y="163" width="38" height="38" fill="#3b82f6" opacity="0.7" rx="3"/>
  <rect x="92" y="208" width="38" height="38" fill="#3b82f6" opacity="0.35" rx="3"/>
  <rect x="137" y="208" width="38" height="38" fill="#3b82f6" opacity="0.5" rx="3"/>
  <rect x="182" y="208" width="38" height="38" fill="#3b82f6" opacity="0.7" rx="3"/>
  <rect x="92" y="253" width="38" height="38" fill="#3b82f6" opacity="0.25" rx="3"/>
  <rect x="137" y="253" width="38" height="38" fill="#3b82f6" opacity="0.35" rx="3"/>
  <rect x="182" y="253" width="38" height="38" fill="#3b82f6" opacity="0.5" rx="3"/>
  <rect x="227" y="253" width="38" height="38" fill="#3b82f6" opacity="0.7" rx="3"/>
  <rect x="92" y="298" width="38" height="38" fill="#3b82f6" opacity="0.2" rx="3"/>
  <rect x="137" y="298" width="38" height="38" fill="#3b82f6" opacity="0.25" rx="3"/>
  <rect x="182" y="298" width="38" height="38" fill="#3b82f6" opacity="0.35" rx="3"/>
  <rect x="227" y="298" width="38" height="38" fill="#3b82f6" opacity="0.5" rx="3"/>
  <rect x="272" y="298" width="38" height="38" fill="#3b82f6" opacity="0.7" rx="3"/>

